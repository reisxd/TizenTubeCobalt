name: Patch TizenTube APK with VOT

on:
  workflow_dispatch:

jobs:
  patch:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Download apktool
        run: |
          curl -fL --retry 5 --retry-all-errors -o apktool.jar \
            https://github.com/iBotPeaches/Apktool/releases/download/v2.9.3/apktool_2.9.3.jar

      - name: Download latest TizenTubeCobalt APK
        run: |
          APK_URL="https://github.com/reisxd/TizenTubeCobalt/releases/latest/download/cobalt-arm64.apk"
          echo "Downloading: $APK_URL"
          curl -fL --retry 5 --retry-all-errors -o tizentube.apk "$APK_URL"
          ls -lh tizentube.apk
          unzip -tq tizentube.apk >/dev/null || { echo "ERROR: Downloaded file is not a valid APK zip"; exit 1; }

      - name: Decompile APK
        run: |
          java -jar apktool.jar d tizentube.apk -o apk_out -f

      - name: Generate vot.js asset
        run: |
          mkdir -p apk_out/assets
          cat > apk_out/assets/vot.js <<'EOF'
          (function(){
            'use strict';
            var VOT_WORKER='https://vot-worker.toil.cc';
            function addBtn(){
              if(document.getElementById('vot-btn')) return;
              var b=document.createElement('button');
              b.id='vot-btn';
              b.textContent='?? ???????';
              b.style='position:fixed;bottom:70px;right:16px;z-index:99999;padding:10px 20px;background:#111;color:#fff;border:2px solid #f90;border-radius:10px;';
              b.onclick=function(){ console.log('[VOT] toggle requested'); };
              document.body.appendChild(b);
            }
            function postProto(url, body){
              return fetch(url,{method:'POST',headers:{'Content-Type':'application/x-protobuf'},body:body});
            }
            if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',addBtn); else addBtn();
          })();
          EOF
          echo "vot.js bytes: $(wc -c < apk_out/assets/vot.js)"

      - name: Inject VOT into runtime JS bundle
        run: |
          JS_BUNDLE=$(find apk_out/assets -maxdepth 1 -name "*.js" -type f -printf '%s %p\n' | sort -rn | head -1 | awk '{print $2}')
          if [ -z "$JS_BUNDLE" ] || [ ! -f "$JS_BUNDLE" ]; then
            echo "ERROR: Runtime JS bundle not found under apk_out/assets"
            exit 1
          fi
          echo "Target runtime bundle: $JS_BUNDLE"
          echo "" >> "$JS_BUNDLE"
          echo "// === Injected VOT script ===" >> "$JS_BUNDLE"
          cat apk_out/assets/vot.js >> "$JS_BUNDLE"
          echo "// === End injected VOT script ===" >> "$JS_BUNDLE"
          echo "Updated runtime bundle bytes: $(wc -c < "$JS_BUNDLE")"

      - name: Generate keystore
        run: |
          keytool -genkey -v -keystore debug.keystore -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 -storepass android -keypass android -dname "CN=Android Debug,O=Android,C=US"

      - name: Recompile APK
        run: |
          java -jar apktool.jar b apk_out -o tizentube_vot_unsigned.apk
          ls -lh tizentube_vot_unsigned.apk

      - name: Align and sign APK
        run: |
          BT=$(ls -d "$ANDROID_SDK_ROOT"/build-tools/* | sort -V | tail -1)
          if [ ! -x "$BT/zipalign" ] || [ ! -x "$BT/apksigner" ]; then
            echo "ERROR: zipalign/apksigner not found in $BT"
            exit 1
          fi
          "$BT/zipalign" -v 4 tizentube_vot_unsigned.apk tizentube_vot_aligned.apk
          "$BT/apksigner" sign --ks debug.keystore --ks-pass pass:android --key-pass pass:android --out tizentube_vot.apk tizentube_vot_aligned.apk
          ls -lh tizentube_vot.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TizenTubeCobalt-VOT
          path: tizentube_vot.apk
          retention-days: 30
