name: Build Cobalt APK (27.lts.20)

on:
  workflow_dispatch:
    inputs:
      platform:
        description: 'Target Architecture'
        required: true
        default: 'android-arm'
        type: choice
        options:
          - android-arm
          - android-arm64
      build_type:
        description: 'Build Type'
        required: true
        default: 'qa'
        type: choice
        options:
          - qa
          - gold
          - devel
      fast_build:
        description: 'Fast Build (symbol_level=0: cuts compile time, RAM, and object file size by ~40%)'
        required: true
        default: true
        type: boolean
        options:
          - true
          - false
      run_iteration:
        description: 'Iteration count (internal guard against infinite loops, max 5)'
        required: false
        default: '1'

env:
  COBALT_VERSION: '27.lts.20'

permissions:
  actions: write
  contents: write

jobs:
  build:
    name: Build 27.lts.20 - ${{ inputs.platform }} (${{ inputs.build_type }}) [Iter ${{ inputs.run_iteration }}]
    runs-on: ubuntu-22.04
    timeout-minutes: 360

    steps:
      - name: Free Disk Space
        uses: jlumbroso/free-disk-space@main
        with:
          preinstalled-runtimes: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: false

      - name: Set up Swap Space (12 GB)
        uses: pierotofy/set-swap-space@master
        with:
          swap-size-gb: 12

      - name: Checkout Source Code (Full History)
        uses: actions/checkout@v4
        with:
          path: src
          fetch-depth: 0

      - name: Configure Git Safe Directory
        run: |
          git config --global --add safe.directory "*"

      - name: Install System Dependencies, 32-bit Arch & ccache
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo apt-get install -y \
            gperf bison flex python3-setuptools \
            gcc-multilib g++-multilib \
            libc6:i386 libstdc++6:i386 libgcc-s1:i386 \
            ninja-build openjdk-17-jdk ccache

      - name: Restore Compiler & Build Cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cache/ccache
          key: build-cobalt-27lts20-${{ inputs.platform }}-${{ inputs.build_type }}-${{ github.run_id }}
          restore-keys: |
            build-cobalt-27lts20-${{ inputs.platform }}-${{ inputs.build_type }}-
            build-cobalt-27lts20-${{ inputs.platform }}-

      - name: Set up Depot Tools & Sync Dependencies
        run: |
          git clone --depth=1 https://chromium.googlesource.com/chromium/tools/depot_tools.git
          export PATH=$PWD/depot_tools:$PATH
          echo "$PWD/depot_tools" >> $GITHUB_PATH
          cat << 'GCLIENT_EOF' > .gclient
          solutions = [
            {
              "name": "src",
              "url": "https://github.com/${{ github.repository }}.git",
              "deps_file": "DEPS",
              "managed": False,
              "custom_deps": {},
            },
          ]
          target_os = ['android']
          GCLIENT_EOF
          gclient sync --no-history

      - name: Switch src to upstream Cobalt 27.lts.20
        run: |
          set -euo pipefail
          cd src
          git remote remove cobalt-upstream 2>/dev/null || true
          git remote add cobalt-upstream https://github.com/youtube/cobalt.git
          if git ls-remote --exit-code --heads cobalt-upstream "${COBALT_VERSION}" >/dev/null 2>&1; then
            git fetch --no-tags --depth=1 cobalt-upstream \
              "+refs/heads/${COBALT_VERSION}:refs/remotes/cobalt-upstream/${COBALT_VERSION}"
          else
            git fetch --no-tags --depth=1 cobalt-upstream \
              "+refs/tags/${COBALT_VERSION}:refs/remotes/cobalt-upstream/${COBALT_VERSION}"
          fi
          git checkout -f --detach "refs/remotes/cobalt-upstream/${COBALT_VERSION}"
          echo "====> src checked out at $(git rev-parse HEAD) for ${COBALT_VERSION}"
          cd ..
          export PATH=$PWD/depot_tools:$PATH
          gclient sync --no-history
          echo "====> Dependencies re-synced against upstream ${COBALT_VERSION} DEPS"

      - name: Patch Cobalt Shell Resource List
        run: |
          cd src
          python3 - <<'PY'
          from pathlib import Path

          path = Path("cobalt/shell/android/BUILD.gn")
          text = path.read_text(encoding="utf-8")
          anchor = '    "java/res/values/styles.xml",\n'
          locales = [
              "java/res/values-de/strings.xml",
              "java/res/values-es/strings.xml",
              "java/res/values-fr/strings.xml",
              "java/res/values-it/strings.xml",
              "java/res/values-pl-rSP/strings.xml",
              "java/res/values-pl/strings.xml",
              "java/res/values-szl/strings.xml",
          ]
          if text.count(anchor) != 1:
              raise SystemExit("ERROR: expected exactly one insertion anchor in BUILD.gn")
          missing = [
              entry
              for entry in locales
              if (path.parent / entry).is_file() and f'"{entry}"' not in text
          ]
          if not missing:
              print("====> No undeclared existing localized resources found; skipping patch.")
          else:
              additions = "".join(f'    "{entry}",\n' for entry in missing)
              path.write_text(text.replace(anchor, anchor + additions), encoding="utf-8")
              print(f"====> Added {len(missing)} localized resource(s) to cobalt_shell_java_resources.")
          PY
          git diff -- cobalt/shell/android/BUILD.gn

      - name: Patch Cobalt CSP Allowlist
        shell: bash
        run: |
          set -euo pipefail
          cd src
          CSP_FILE=""
          for candidate in \
            "third_party/blink/renderer/core/frame/csp/content_security_policy.cc" \
            "cobalt/csp/directive_list.cc"
          do
            if [ -f "$candidate" ]; then
              CSP_FILE="$candidate"
              break
            fi
          done
          if [ -z "$CSP_FILE" ]; then
            echo "CSP target file not found, skipping allowlist patch."
            exit 0
          fi
          DOMAINS=(
            "sponsorblock.inf.re"
            "sponsor.ajay.app"
            "dearrow-thumb.ajay.app"
            "cdn.jsdelivr.net"
          )
          MISSING=0
          for d in "${DOMAINS[@]}"; do
            if ! grep -qF "$d" "$CSP_FILE"; then
              MISSING=1
              break
            fi
          done
          if [ "$MISSING" -eq 0 ]; then
            echo "All CSP allowlist domains already present in $CSP_FILE; skipping."
            exit 0
          fi
          python3 - "$CSP_FILE" "${DOMAINS[@]}" <<'PY'
          import sys
          from pathlib import Path

          path = Path(sys.argv[1])
          domains = sys.argv[2:]
          text = path.read_text(encoding="utf-8")
          missing = [d for d in domains if f'"{d}"' not in text]
          if not missing:
              sys.exit(0)

          if "kAllowList" in text:
              lines = text.splitlines(keepends=True)
              out = []
              inserted = False
              for line in lines:
                  out.append(line)
                  if (
                      not inserted
                      and "AllowList" in line
                      and ("{" in line or "[" in line)
                  ):
                      indent = line[: len(line) - len(line.lstrip(" "))] + "    "
                      for d in missing:
                          out.append(f'{indent}"{d}",\n')
                      inserted = True
              if not inserted:
                  sys.exit(f"ERROR: kAllowList opening line not found in {path}")
              text = "".join(out)
          elif "AllowFromSource(" in text:
              entries = "\n".join(f'    "{d}",' for d in missing)
              block = (
                  "\n  static const char* const kAllowList[] = {\n"
                  f"{entries}\n"
                  "  };\n"
                  "  for (const char* host : kAllowList) {\n"
                  "    if (url.Host() == host)\n"
                  "      return true;\n"
                  "  }\n"
              )
              anchor_pos = text.find("ContentSecurityPolicy::AllowFromSource(")
              if anchor_pos == -1:
                  anchor_pos = text.find("AllowFromSource(")
              idx = text.find("{", anchor_pos)
              if idx != -1:
                  text = text[: idx + 1] + block + text[idx + 1 :]
          path.write_text(text, encoding="utf-8")
          PY
          git diff -- "$CSP_FILE" || true

      - name: Patch Document Load Event Userscript Injection
        shell: bash
        run: |
          set -euo pipefail
          cd src
          DOC_FILE=""
          for candidate in \
            "third_party/blink/renderer/core/dom/document.cc" \
            "cobalt/dom/document.cc"
          do
            if [ -f "$candidate" ]; then
              DOC_FILE="$candidate"
              break
            fi
          done
          if [ -z "$DOC_FILE" ]; then
            echo "Document target file not found, skipping userscript patch."
            exit 0
          fi
          SCRIPT_URL="https://cdn.jsdelivr.net/npm/@foxreis/tizentube/dist/userScript.js"
          if grep -qF "$SCRIPT_URL" "$DOC_FILE" || grep -qF "tizentube-userscript" "$DOC_FILE"; then
            echo "Userscript injection already present in $DOC_FILE; skipping."
            exit 0
          fi
          python3 - "$DOC_FILE" "$SCRIPT_URL" <<'PY'
          import sys
          from pathlib import Path

          path = Path(sys.argv[1])
          url = sys.argv[2]
          text = path.read_text(encoding="utf-8")
          anchor = None
          for candidate_anchor in ("Document::ImplicitClose()", "DispatchOnLoadEvent()"):
              pos = text.find(candidate_anchor)
              if pos != -1:
                  brace_pos = text.find("{", pos)
                  if brace_pos != -1:
                      anchor = brace_pos + 1
                      break
          if anchor is None:
              print("Target anchor not found in document.cc; skipping.", file=sys.stderr)
              sys.exit(0)
          snippet = f"""
            // TizenTube userscript injection
            if (!getElementById(AtomicString("tizentube-userscript"))) {{
              Element* script_el = CreateRawElement(html_names::kScriptTag);
              script_el->setAttribute(html_names::kIdAttr,
                                      AtomicString("tizentube-userscript"));
              script_el->setAttribute(html_names::kAsyncAttr, AtomicString("true"));
              script_el->setAttribute(html_names::kSrcAttr, AtomicString("{url}"));
              if (head()) {{
                head()->AppendChild(script_el);
              }} else if (documentElement()) {{
                documentElement()->AppendChild(script_el);
              }}
            }}
          """
          updated = text[:anchor] + snippet + text[anchor:]
          path.write_text(updated, encoding="utf-8")
          PY
          git diff -- "$DOC_FILE" || true

      - name: Generate Android Debug Keystore
        run: |
          OUT_DIR="out/${{ inputs.platform }}_${{ inputs.build_type }}"
          mkdir -p ~/.android
          keytool -genkey -v -keystore ~/.android/debug.keystore \
            -storepass android -alias androiddebugkey -keypass android \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "C=US, O=Android, CN=Android Debug"
          for d in "$HOME" "$GITHUB_WORKSPACE" "$GITHUB_WORKSPACE/.." "$GITHUB_WORKSPACE/../.." "$GITHUB_WORKSPACE/src" "$GITHUB_WORKSPACE/src/out" "$GITHUB_WORKSPACE/src/$OUT_DIR"; do
            mkdir -p "$d/.android" 2>/dev/null || true
            cp ~/.android/debug.keystore "$d/.android/debug.keystore" 2>/dev/null || true
          done

      - name: Generate GN Build Files & Compile Cobalt APK
        run: |
          echo "START_TIME=$(date +%s)" >> $GITHUB_ENV
          export PATH=$PWD/depot_tools:$PATH
          cd src
          OUT_DIR="out/${{ inputs.platform }}_${{ inputs.build_type }}"
          export CCACHE_DIR=~/.cache/ccache
          export CCACHE_MAXSIZE=9G
          export CCACHE_COMPRESS=true
          export CCACHE_COMPRESSLEVEL=6
          export CCACHE_COMPILERCHECK=content
          export CCACHE_SLOPPINESS=time_macros,include_file_mtime,include_file_ctime,file_macro
          export CCACHE_BASEDIR=$PWD
          export CCACHE_NOHASHDIR=true
          export CCACHE_CPP2=yes
          ccache -M 9G
          ccache -s
          echo "====> Generating GN build configuration for Cobalt ${COBALT_VERSION}..."
          python3 cobalt/build/gn.py -p ${{ inputs.platform }} -c ${{ inputs.build_type }} --no-rbe
          if [ "${{ inputs.fast_build }}" = "true" ]; then
            echo "====> Fast build enabled: setting symbol_level = 0, blink_symbol_level = 0, use_thin_lto = false"
            sed -i -E 's/symbol_level = [0-9]+/symbol_level = 0/g' ${OUT_DIR}/args.gn
            grep -q 'blink_symbol_level' ${OUT_DIR}/args.gn && \
              sed -i -E 's/blink_symbol_level = [0-9]+/blink_symbol_level = 0/g' ${OUT_DIR}/args.gn || \
              echo 'blink_symbol_level = 0' >> ${OUT_DIR}/args.gn
            grep -q 'use_thin_lto' ${OUT_DIR}/args.gn && \
              sed -i -E 's/use_thin_lto = (true|false)/use_thin_lto = false/g' ${OUT_DIR}/args.gn || \
              echo 'use_thin_lto = false' >> ${OUT_DIR}/args.gn
          fi
          sed -i '/cc_wrapper/d' ${OUT_DIR}/args.gn
          echo 'cc_wrapper = "ccache"' >> ${OUT_DIR}/args.gn
          echo "====> Re-running gn gen with optimizations..."
          gn gen ${OUT_DIR}
          echo "====> Active args.gn configuration:"
          cat ${OUT_DIR}/args.gn
          NPROC=$(nproc)
          echo "====> Compiling cobalt_apk with Ninja using ${NPROC} workers (4.2h safety window)..."
          set +e
          timeout 4.2h ninja -C ${OUT_DIR} -j ${NPROC} cobalt_apk
          NINJA_EXIT=$?
          set -e
          echo "NINJA_EXIT_CODE=${NINJA_EXIT}" >> $GITHUB_ENV
          echo "Ninja exited with code: ${NINJA_EXIT}"
          ccache -s
          if [ ${NINJA_EXIT} -eq 0 ]; then
            echo "====> cobalt_apk build completed successfully!"
          elif [ ${NINJA_EXIT} -eq 124 ]; then
            echo "====> 4.2h safety timeout reached. Compiler cache saved for continuation run."
          else
            echo "====> Compilation error occurred (exit code: ${NINJA_EXIT})."
            exit ${NINJA_EXIT}
          fi

      - name: Cleanup Compiler Processes
        if: always()
        run: |
          killall -9 ninja clang clang++ python3 2>/dev/null || true
          sleep 5

      - name: Save Compiler & Build Cache
        uses: actions/cache/save@v4
        if: always()
        with:
          path: |
            ~/.cache/ccache
          key: build-cobalt-27lts20-${{ inputs.platform }}-${{ inputs.build_type }}-${{ github.run_id }}

      - name: Inspect generated APKs
        if: always()
        run: |
          OUT_DIR="src/out/${{ inputs.platform }}_${{ inputs.build_type }}"
          echo "Searching for APK files in: ${OUT_DIR}"
          find "$OUT_DIR" -type f -name '*.apk' -print 2>/dev/null || true
          APK_COUNT=$(find "$OUT_DIR" -type f -name '*.apk' 2>/dev/null | wc -l)
          echo "Found ${APK_COUNT} APK(s)"
          if [ "$APK_COUNT" -gt 0 ]; then
            echo "HAS_APK=true" >> $GITHUB_ENV
          else
            echo "HAS_APK=false" >> $GITHUB_ENV
          fi

      - name: Upload Cobalt APK Artifact
        if: always() && env.HAS_APK == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: cobalt-${{ env.COBALT_VERSION }}-${{ inputs.platform }}-${{ inputs.build_type }}-apk
          path: src/out/${{ inputs.platform }}_${{ inputs.build_type }}/**/*.apk
          if-no-files-found: warn

      - name: Create or Update GitHub Release
        if: always() && env.HAS_APK == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          OUT_DIR="src/out/${{ inputs.platform }}_${{ inputs.build_type }}"
          APK_FILE=$(find "$OUT_DIR" -type f -name 'Cobalt.apk' | head -n 1)
          if [ -n "$APK_FILE" ]; then
            TAG_NAME="${{ env.COBALT_VERSION }}-${{ inputs.build_type }}"
            RELEASE_TITLE="Cobalt ${{ env.COBALT_VERSION }} (${{ inputs.build_type }})"
            RELEASE_ASSET="Cobalt-${{ env.COBALT_VERSION }}-${{ inputs.platform }}-${{ inputs.build_type }}.apk"
            cp "$APK_FILE" "./$RELEASE_ASSET"
            echo "Publishing GitHub Release: $TAG_NAME with asset: $RELEASE_ASSET"
            gh release view "$TAG_NAME" >/dev/null 2>&1 && \
              gh release upload "$TAG_NAME" "./$RELEASE_ASSET" --clobber || \
              gh release create "$TAG_NAME" "./$RELEASE_ASSET" \
                --title "$RELEASE_TITLE" \
                --notes "Automated release of Cobalt ($RELEASE_TITLE) targeting ${{ inputs.platform }}." || true
          fi

      - name: Auto-Resume Workflow if Timed Out
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          END_TIME=$(date +%s)
          DURATION=$((END_TIME - START_TIME))
          echo "Total elapsed time: ${DURATION}s"
          APK_COUNT=$(find src/out/${{ inputs.platform }}_${{ inputs.build_type }} -name "*.apk" 2>/dev/null | wc -l)
          if [ ${APK_COUNT} -gt 0 ]; then
            echo "====> SUCCESS: APK was created! No continuation needed."
            exit 0
          fi
          ITERATION="${{ inputs.run_iteration || '1' }}"
          NEXT_ITERATION=$((ITERATION + 1))
          echo "Current iteration: ${ITERATION}, Next iteration: ${NEXT_ITERATION}"
          if [ ${ITERATION} -ge 5 ]; then
            echo "::error::Maximum auto-resume limit (5 iterations) reached. Halting to prevent infinite loop."
            exit 1
          fi
          if [ "${NINJA_EXIT_CODE}" = "124" ] || [ ${DURATION} -gt 14400 ]; then
            echo "====> Time limit reached before completion. Re-triggering next run with warm compiler cache (iteration ${NEXT_ITERATION})..."
            gh workflow run "${{ github.workflow }}" \
              --repo "${{ github.repository }}" \
              -f platform="${{ inputs.platform }}" \
              -f build_type="${{ inputs.build_type }}" \
              -f fast_build="${{ inputs.fast_build }}" \
              -f run_iteration="${NEXT_ITERATION}" \
              --ref "${{ github.ref_name }}"
          else
            echo "====> Early exit or non-timeout failure. Halting without auto-resume."
            exit 1
          fi
